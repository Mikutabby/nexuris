[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuris"
version = "2.0.0"
description = "Asistente del hogar que aprende de interacciones, sin guion de personalidad"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
]

[project.scripts]
nexuris = "nexuris.cli:main"
nexuris-mcp = "nexuris.mcp_server:main"

[tool.setuptools.packages.find]
include = ["nexuris*"]
